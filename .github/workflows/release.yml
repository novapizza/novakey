name: Release NovaKey

# Tag a release: git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # create the GitHub Release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── macOS: Developer ID sign + notarize + staple ──────────────────────────
  macos:
    runs-on: macos-14
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.CSC_LINK }}            # Developer ID Application .p12, base64
          CERT_PW:  ${{ secrets.CSC_KEY_PASSWORD }}    # .p12 export password
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Make the temp keychain visible to codesign without hiding the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          # Auto-detect the imported Developer ID identity for build.sh.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*\) ([0-9A-F]+) .*/\1/')"
          if [[ -z "$IDENTITY" ]]; then echo "✗ No Developer ID Application identity imported." >&2; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build + sign + notarize
        env:
          NOTARIZE:                    '1'
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./build.sh   # SIGN_IDENTITY comes from the import step via GITHUB_ENV

      - name: Package artifact (.zip)
        run: |
          set -euo pipefail
          /usr/bin/ditto -c -k --keepParent build/NovaKey.app "NovaKey-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: novakey-macos
          path: NovaKey-macos.zip

  # ── Windows: build Rust port + signtool + Azure Trusted Signing ───────────
  # Builds novakey-win (crossplatform/windows) → NovaKey.exe, signs via
  # Azure Trusted Signing, packages the zip.
  windows:
    runs-on: windows-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform

      - name: Test engine parity + Windows units
        shell: pwsh
        working-directory: crossplatform
        run: cargo test --release

      - name: Build novakey.exe
        shell: pwsh
        working-directory: crossplatform
        run: cargo build -p novakey-win --release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item crossplatform/target/release/novakey.exe build/NovaKey.exe

      - name: Install Trusted Signing client
        shell: pwsh
        run: |
          # Microsoft.Trusted.Signing.Client is a NuGet package, NOT a dotnet tool.
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.86 `
            -OutputDirectory "$env:RUNNER_TEMP\ts" -ExcludeVersion
          $dlib = Join-Path $env:RUNNER_TEMP "ts\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "dlib not found at $dlib" }
          "TRUSTED_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV

      - name: Write Trusted Signing metadata
        shell: pwsh
        env:
          TS_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT:  ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          TS_PROFILE:  ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          @{
            Endpoint               = $env:TS_ENDPOINT
            CodeSigningAccountName = $env:TS_ACCOUNT
            CertificateProfileName = $env:TS_PROFILE
          } | ConvertTo-Json | Set-Content -Path scripts/trusted-signing-metadata.json -Encoding utf8

      - name: Sign
        shell: pwsh
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_PUBLISHER_NAME is the MSIX manifest publisher CN (only needed if packaging .msix).
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: ./scripts/sign-windows.ps1 -Path build/NovaKey.exe

      - name: Package artifact (.zip)
        shell: pwsh
        run: Compress-Archive -Path build/NovaKey.exe -DestinationPath NovaKey-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: novakey-windows
          path: NovaKey-windows.zip

  # ── Publish GitHub Release with both artifacts ────────────────────────────
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip

      - name: Upload assets to Cloudflare R2
        env:
          TAG:                   ${{ github.event.inputs.tag || github.ref_name }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ACCOUNT_ID:         ${{ secrets.R2_RELEASES_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.R2_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Versioned copy (immutable) + rolling "latest" for download links.
          for f in dist/*.zip; do
            base="$(basename "$f")"
            aws s3 cp "$f" "s3://${R2_BUCKET}/${TAG}/${base}" --endpoint-url "$ENDPOINT"
            aws s3 cp "$f" "s3://${R2_BUCKET}/latest/${base}"  --endpoint-url "$ENDPOINT"
          done
