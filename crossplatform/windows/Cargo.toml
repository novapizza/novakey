[package]
name = "novakey-win"
version = "0.1.0"
edition = "2021"
description = "NovaKey Windows app — low-level keyboard hook + SendInput Telex IME"
license = "MIT"

[[bin]]
name = "novakey"
path = "src/main.rs"

[dependencies]
novakey-core = { path = "../core" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_System_Registry", "Win32_Foundation"]

[build-dependencies]
# Embeds assets/NovaKey.ico as the exe's application icon (RT_GROUP_ICON id 1).
# Locates the Windows SDK rc.exe automatically under an MSVC toolchain.
winresource = "0.1"
